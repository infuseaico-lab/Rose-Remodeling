<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="b-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4EEEA"/><stop offset="1" stop-color="#E8DED9"/></linearGradient>
    <linearGradient id="b-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/><stop offset=".5" stop-color="#DCE7EA" stop-opacity=".25"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".4"/></linearGradient>
    <linearGradient id="b-brass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B98F55"/><stop offset=".5" stop-color="#E2C48E"/><stop offset="1" stop-color="#A97F47"/></linearGradient>
    <linearGradient id="b-oak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C79C74"/><stop offset="1" stop-color="#AE845E"/></linearGradient>
    <linearGradient id="b-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6D9CF"/><stop offset="1" stop-color="#E7EDE6"/></linearGradient>
    <radialGradient id="b-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFEBD0" stop-opacity=".8"/><stop offset="1" stop-color="#FFEBD0" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- room -->
  <rect width="800" height="1000" fill="url(#b-wall)"/>
  <!-- stacked zellige-style tile wall behind vanity -->
  <rect x="0" y="300" width="500" height="580" fill="#EFE4DF"/>
  <g stroke="#E0D2CC" stroke-width="2"><path d="M0 340h500M0 380h500M0 420h500M0 460h500M0 500h500M0 540h500M0 580h500M0 620h500M0 660h500M0 700h500M0 740h500M0 780h500M0 820h500M0 860h500"/></g>
  <!-- floor -->
  <rect y="880" width="800" height="120" fill="#D8CCC5"/>
  <g stroke="#C6B7AF" stroke-width="2"><path d="M0 930h800M200 880v120M400 880v120M600 880v120"/></g>

  <!-- clerestory window -->
  <rect x="80" y="110" width="340" height="120" fill="#211D1E"/>
  <rect x="90" y="120" width="320" height="100" fill="url(#b-sky)"/>
  <path d="M90 200c50-20 110-26 170-12s100 0 150-14v46H90z" fill="#A9BCA4"/>
  <rect x="247" y="120" width="6" height="100" fill="#211D1E"/>

  <!-- round brass mirrors with glow -->
  <ellipse cx="160" cy="420" rx="120" ry="110" fill="url(#b-glow)"/>
  <ellipse cx="340" cy="420" rx="120" ry="110" fill="url(#b-glow)"/>
  <circle cx="160" cy="430" r="78" fill="url(#b-brass)"/>
  <circle cx="160" cy="430" r="71" fill="#E6E2DE"/>
  <path d="M120 390a60 60 0 0 1 60-20" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity=".8"/>
  <circle cx="340" cy="430" r="78" fill="url(#b-brass)"/>
  <circle cx="340" cy="430" r="71" fill="#E6E2DE"/>
  <path d="M300 390a60 60 0 0 1 60-20" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity=".8"/>
  <!-- wall sconces -->
  <rect x="246" y="400" width="8" height="56" rx="4" fill="url(#b-brass)"/>
  <circle cx="250" cy="392" r="12" fill="#FFF3DD"/>

  <!-- floating oak double vanity -->
  <ellipse cx="250" cy="790" rx="230" ry="10" fill="#000" opacity=".08"/>
  <rect x="30" y="590" width="440" height="22" fill="#F7F4F2"/>
  <rect x="40" y="612" width="420" height="140" fill="url(#b-oak)"/>
  <g stroke="#9E7553" stroke-width="3"><path d="M250 612v140M40 682h420"/></g>
  <g fill="url(#b-brass)"><rect x="135" y="642" width="30" height="5" rx="2.5"/><rect x="335" y="642" width="30" height="5" rx="2.5"/><rect x="135" y="712" width="30" height="5" rx="2.5"/><rect x="335" y="712" width="30" height="5" rx="2.5"/></g>
  <!-- vessel sinks and faucets -->
  <path d="M110 590a50 26 0 0 0 100 0z" fill="#FFFFFF" stroke="#DCD3CF" stroke-width="2"/>
  <path d="M290 590a50 26 0 0 0 100 0z" fill="#FFFFFF" stroke="#DCD3CF" stroke-width="2"/>
  <path d="M160 560v-26q0-12 12-12h14v14M340 560v-26q0-12 12-12h14v14" fill="none" stroke="url(#b-brass)" stroke-width="6" stroke-linecap="round"/>
  <!-- small vase and soap -->
  <path d="M232 590c-6-16-4-34 6-42 10 8 12 26 6 42z" fill="#E7B7AE"/>
  <path d="M238 548c-4-22-16-36-28-42M240 548c4-24 14-38 28-44" fill="none" stroke="#6E8B71" stroke-width="3" stroke-linecap="round"/>

  <!-- walk-in shower -->
  <rect x="520" y="140" width="280" height="740" fill="#E5DAD5"/>
  <g stroke="#D3C4BE" stroke-width="2"><path d="M520 220h280M520 300h280M520 380h280M520 460h280M520 540h280M520 620h280M520 700h280M520 780h280M600 140v740M700 140v740"/></g>
  <rect x="520" y="860" width="280" height="20" fill="#CFC1BA"/>
  <!-- niche -->
  <rect x="650" y="470" width="110" height="70" fill="#D6C7C1"/>
  <rect x="664" y="500" width="18" height="40" rx="4" fill="#F7F3F1"/><rect x="690" y="508" width="16" height="32" rx="4" fill="#E7B7AE"/>
  <!-- rain head and valve -->
  <path d="M760 140v70h-70" fill="none" stroke="url(#b-brass)" stroke-width="6"/>
  <rect x="640" y="206" width="100" height="10" rx="5" fill="url(#b-brass)"/>
  <g stroke="#C9D7DB" stroke-width="2" stroke-dasharray="6 12" opacity=".7"><path d="M650 222v220M670 222v240M690 222v230M710 222v250M730 222v220"/></g>
  <circle cx="720" cy="620" r="16" fill="url(#b-brass)"/>
  <!-- glass panel with black frame -->
  <rect x="510" y="200" width="150" height="680" fill="url(#b-glass)"/>
  <rect x="506" y="200" width="8" height="680" fill="#211D1E"/>
  <rect x="506" y="200" width="154" height="8" fill="#211D1E"/>
  <path d="M540 260l80 -40M540 300l100 -50" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".6"/>

  <!-- bath mat -->
  <rect x="150" y="900" width="200" height="40" rx="6" fill="#E7B7AE"/>
  <g stroke="#D79A8F" stroke-width="2"><path d="M170 910v20M190 910v20M210 910v20M230 910v20M250 910v20M270 910v20M290 910v20M310 910v20M330 910v20"/></g>
  <!-- floor plant -->
  <path d="M440 880h60l-8-70h-44z" fill="#F7F3F1" stroke="#DCD3CF" stroke-width="2"/>
  <path d="M470 810c-4-60-30-110-62-130M470 810c6-70 30-110 60-128M470 810c0-70-4-120-14-150" fill="none" stroke="#6E8B71" stroke-width="5" stroke-linecap="round"/>
  <g fill="#7F9A80"><ellipse cx="410" cy="684" rx="18" ry="8" transform="rotate(-35 410 684)"/><ellipse cx="528" cy="686" rx="18" ry="8" transform="rotate(35 528 686)"/><ellipse cx="456" cy="664" rx="16" ry="7" transform="rotate(-75 456 664)"/><ellipse cx="440" cy="740" rx="16" ry="7" transform="rotate(-40 440 740)"/><ellipse cx="506" cy="736" rx="16" ry="7" transform="rotate(40 506 736)"/></g>
</svg>
