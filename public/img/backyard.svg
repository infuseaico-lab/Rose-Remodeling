<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="y-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D9E2"/><stop offset=".55" stop-color="#F3DCD2"/><stop offset="1" stop-color="#F7E8DF"/></linearGradient>
    <linearGradient id="y-lawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9DB394"/><stop offset="1" stop-color="#7E9A78"/></linearGradient>
    <linearGradient id="y-oak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C79C74"/><stop offset="1" stop-color="#A9805B"/></linearGradient>
    <linearGradient id="y-glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE7C7"/><stop offset="1" stop-color="#F2C9A4"/></linearGradient>
    <radialGradient id="y-sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFF1DC"/><stop offset="1" stop-color="#FFF1DC" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- sky, sun, hills -->
  <rect width="800" height="1000" fill="url(#y-sky)"/>
  <circle cx="620" cy="330" r="150" fill="url(#y-sun)"/>
  <circle cx="620" cy="330" r="38" fill="#FFF1DC"/>
  <path d="M0 470c120-50 230-60 360-34s260 20 440-30v170H0z" fill="#B7C6B3"/>
  <path d="M0 520c150-30 300-30 430-10s240 6 370-20v140H0z" fill="#A3B79F"/>
  <!-- wood fence -->
  <rect x="0" y="470" width="800" height="150" fill="#B48C69"/>
  <g stroke="#9C7553" stroke-width="3"><path d="M0 500h800M0 530h800M0 560h800M0 590h800"/></g>

  <!-- ADU: white stucco box, oak cladding, flat roof -->
  <rect x="90" y="300" width="460" height="22" fill="#2B2627"/>
  <rect x="100" y="322" width="440" height="330" fill="#F7F3EF"/>
  <rect x="380" y="322" width="160" height="330" fill="url(#y-oak)"/>
  <g stroke="#9E7553" stroke-width="3"><path d="M396 322v330M412 322v330M428 322v330M444 322v330M460 322v330M476 322v330M492 322v330M508 322v330M524 322v330"/></g>
  <!-- sliding glass door with black frame, warm interior -->
  <rect x="140" y="390" width="210" height="262" fill="#211D1E"/>
  <rect x="148" y="398" width="96" height="254" fill="url(#y-glass)"/>
  <rect x="250" y="398" width="92" height="254" fill="url(#y-glass)"/>
  <rect x="160" y="560" width="70" height="40" rx="6" fill="#E7B7AE" opacity=".8"/>
  <path d="M290 430v80" stroke="#211D1E" stroke-width="2"/><circle cx="290" cy="514" r="10" fill="#E2C48E"/>
  <path d="M170 420l40-14M265 430l50-18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  <!-- clerestory window on the oak side -->
  <rect x="410" y="360" width="100" height="60" fill="#211D1E"/>
  <rect x="416" y="366" width="88" height="48" fill="url(#y-glass)"/>
  <!-- wall light -->
  <rect x="362" y="430" width="10" height="24" rx="3" fill="#2B2627"/>
  <!-- step and deck -->
  <rect x="120" y="652" width="430" height="20" fill="#D9CDC4"/>

  <!-- string lights -->
  <path d="M0 250q200 90 400 30t400 40" fill="none" stroke="#2B2627" stroke-width="2"/>
  <g fill="#FFE2A8"><circle cx="60" cy="282" r="6"/><circle cx="140" cy="303" r="6"/><circle cx="220" cy="312" r="6"/><circle cx="300" cy="303" r="6"/><circle cx="380" cy="286" r="6"/><circle cx="460" cy="269" r="6"/><circle cx="540" cy="264" r="6"/><circle cx="620" cy="270" r="6"/><circle cx="700" cy="281" r="6"/><circle cx="770" cy="292" r="6"/></g>

  <!-- olive tree -->
  <path d="M690 700c4-60-6-110 0-170M690 600c-20-30-40-40-60-48M692 570c20-26 40-34 60-36" fill="none" stroke="#6B5646" stroke-width="10" stroke-linecap="round"/>
  <g fill="#8EA68A"><ellipse cx="640" cy="490" rx="70" ry="48"/><ellipse cx="730" cy="470" rx="70" ry="52"/><ellipse cx="690" cy="420" rx="66" ry="50"/></g>
  <g fill="#7C9578"><ellipse cx="610" cy="520" rx="40" ry="24"/><ellipse cx="760" cy="510" rx="40" ry="26"/><ellipse cx="700" cy="380" rx="36" ry="24"/></g>

  <!-- lawn and paver path -->
  <rect y="672" width="800" height="328" fill="url(#y-lawn)"/>
  <g fill="#E4DAD3"><path d="M210 688h110l6 34H204z"/><path d="M196 744h138l8 40H188z"/><path d="M176 808h172l10 48H166z"/><path d="M150 880h214l12 58H138z"/><path d="M120 962h264l10 38H110z"/></g>
  <!-- planting bed along fence -->
  <rect x="560" y="640" width="240" height="40" fill="#5E4A3D"/>
  <g fill="#6E8B71"><circle cx="590" cy="636" r="20"/><circle cx="640" cy="630" r="24"/><circle cx="700" cy="636" r="20"/><circle cx="760" cy="630" r="24"/></g>
  <g fill="#E7B7AE"><circle cx="598" cy="624" r="5"/><circle cx="646" cy="616" r="5"/><circle cx="708" cy="624" r="5"/><circle cx="752" cy="616" r="5"/></g>

  <!-- lounge chairs -->
  <ellipse cx="560" cy="905" rx="150" ry="14" fill="#000" opacity=".1"/>
  <g>
    <path d="M440 900l20-70h50l-14 70z" fill="#2B2627"/>
    <path d="M454 836l12-46" stroke="#2B2627" stroke-width="8" stroke-linecap="round"/>
    <rect x="444" y="820" width="80" height="22" rx="10" fill="#E7B7AE"/>
    <path d="M590 900l20-70h50l-14 70z" fill="#2B2627"/>
    <path d="M604 836l12-46" stroke="#2B2627" stroke-width="8" stroke-linecap="round"/>
    <rect x="594" y="820" width="80" height="22" rx="10" fill="#E7B7AE"/>
    <!-- side table -->
    <rect x="540" y="850" width="40" height="8" rx="3" fill="#C79C74"/><path d="M560 858v42" stroke="#2B2627" stroke-width="4"/>
    <circle cx="552" cy="842" r="8" fill="#F7F3EF"/>
  </g>
</svg>
